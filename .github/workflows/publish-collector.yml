name: Publish collector

on:
  push:
    tags: ["collector-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#collector-v}"
          PKG_VERSION="$(node -p "require('./packages/ccusage-collector/package.json').version")"
          echo "tag: $TAG_VERSION, package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "Bump packages/ccusage-collector/package.json to $TAG_VERSION first."
            exit 1
          fi

      - name: Typecheck
        run: pnpm --filter ccusage-collector typecheck

      - name: Lint
        run: pnpm --filter ccusage-collector lint

      - name: Test
        run: pnpm --filter ccusage-collector test

      - name: Build
        run: pnpm --filter ccusage-collector build

      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: packages/ccusage-collector
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
